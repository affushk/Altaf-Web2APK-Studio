name: Test Bunny Child Profile

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/test-bunny-profile.yml'
      - 'bunny-standalone/app/src/main/assets/www/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Verify first-launch profile and dynamic name
        run: |
          (cd bunny-standalone/app/src/main/assets/www && python3 -m http.server 8000 >/tmp/bunny-profile-http.log 2>&1) &

          cat > profile-test.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:430,height:900}});

            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));

            await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(1200);

            const modal=page.locator('#bunny-profile-modal');
            if(await modal.count()!==1) throw new Error('First-launch profile modal missing');

            await page.locator('#bunny-child-name').fill('Arhan');
            await page.locator('#bunny-child-age').fill('6');
            await page.locator('#bunny-child-gender').selectOption('boy');
            await page.locator('#bunny-profile-save').click();

            await page.waitForLoadState('domcontentloaded');
            await page.waitForTimeout(1400);

            const state=await page.evaluate(()=>({
              text:document.body?.innerText||'',
              profile:JSON.parse(localStorage.getItem('bunny-child-profile-v1')||'null'),
              profileButton:!!document.getElementById('bunny-profile-launch'),
              modal:!!document.getElementById('bunny-profile-modal')
            }));

            if(!state.profile || state.profile.name!=='Arhan' || state.profile.age!==6 || state.profile.gender!=='boy')
              throw new Error('Saved profile incorrect: '+JSON.stringify(state.profile));

            if(!state.profileButton) throw new Error('Profile edit button missing');
            if(state.modal) throw new Error('Profile modal should not reopen after save');
            if(!state.text.includes('Arhan')) throw new Error('Personalized name Arhan not rendered');
            if(state.text.includes('Raabiya') || state.text.includes('राबिया')) throw new Error('Old Raabiya name still visible');
            if(errors.length) throw new Error('Page errors: '+errors.join(' | '));

            // Verify personalization survives navigation.
            await page.getByRole('button',{name:/ABC/i}).first().click();
            await page.waitForTimeout(800);
            const abcText=await page.locator('body').innerText();
            if(!abcText.includes('ABC सीखो')) throw new Error('ABC navigation failed');
            if(abcText.includes('Raabiya') || abcText.includes('राबिया')) throw new Error('Old name returned after navigation');

            await page.screenshot({path:'bunny-profile-test.png',fullPage:true});
            fs.writeFileSync('bunny-profile-state.json',JSON.stringify({state,abcText:abcText.slice(0,5000)},null,2));
            console.log('PROFILE_TEST_PASS',JSON.stringify(state));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

          node profile-test.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bunny-Profile-Test
          path: |
            bunny-profile-test.png
            bunny-profile-state.json
