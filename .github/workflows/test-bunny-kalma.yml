name: Test Bunny Kalma Naat

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/test-bunny-kalma.yml'
      - 'bunny-standalone/app/src/main/assets/www/kalma-naat.*'
      - 'bunny-standalone/app/src/main/assets/www/index.html'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Verify Kalma poem card
        run: |
          (cd bunny-standalone/app/src/main/assets/www && python3 -m http.server 8000 >/tmp/kalma-http.log 2>&1) &
          cat > kalma-test.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:430,height:900}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));

            await page.goto('http://127.0.0.1:8000/index.html');
            await page.waitForTimeout(700);
            await page.locator('#bunny-child-name').fill('Aafiya');
            await page.locator('#bunny-child-age').fill('5');
            await page.locator('#bunny-child-gender').selectOption('girl');
            await page.locator('#bunny-profile-save').click();
            await page.waitForTimeout(1700);

            await page.getByRole('button',{name:/कविता/}).first().click();
            await page.waitForTimeout(650);

            if(await page.locator('#bunny-kalima-card').count()!==1) throw new Error('Kalma card missing in Poems');
            await page.locator('#bunny-kalima-card').click();

            const modal=page.locator('#bunny-kalima-modal');
            if(await modal.count()!==1) throw new Error('Kalma modal missing');
            const text=await modal.innerText();
            if(!text.includes('Pehla Kalma Tayyab')) throw new Error('Kalma title missing');
            if(!text.includes('Tayyab maane paak')) throw new Error('User requested rhyme line missing');
            if(!text.includes('La ilaha illallah')) throw new Error('Kalma transliteration missing');

            if(await page.locator('#bunny-kalima-listen').count()!==1) throw new Error('Direct Listen button missing');
            if(await page.locator('#bunny-kalima-repeat').count()!==1) throw new Error('Repeat button missing');
            if(await page.locator('#bunny-kalima-stop').count()!==1) throw new Error('Stop button missing');
            await page.locator('#bunny-kalima-listen').click();
            await page.waitForTimeout(150);
            const directText=await page.evaluate(()=>window.BunnyKalmaNaat.text());
            if(!directText.includes('پہلا کلمہ طیب') || !directText.includes('لا الٰہ الا اللہ') || !directText.includes('محمد رسول اللہ')) throw new Error('Urdu Kalma voice text incomplete');
            if(!(await modal.innerText()).includes('Urdu Bunny Voice')) throw new Error('Urdu voice badge missing');
            if(await page.locator('.bunny-kalima-karaoke-line').count()!==4) throw new Error('Four live reading lines missing');

            // Simulate native TTS word-range callback and verify word + line karaoke.
            const targetStart=Number(await page.locator('[data-kline="1"] .bunny-kalima-word').first().getAttribute('data-start'));
            await page.evaluate((s)=>{window.BunnyKalmaNaat.onVoiceMode('urdu');window.BunnyKalmaNaat.onStart();window.BunnyKalmaNaat.onRange(s,s+1)},targetStart);
            if(await page.locator('[data-kline="1"].active').count()!==1) throw new Error('Current line highlight missing');
            if(await page.locator('[data-kline="1"] .bunny-kalima-word.active').count()!==1) throw new Error('Urdu word live highlight missing');
            if(await page.locator('[data-kline="1"] .bunny-kalima-roman-word.active').count()!==1) throw new Error('Roman word live highlight missing');

            await page.evaluate(()=>window.BunnyKalmaNaat.onDone());
            if(!(await page.locator('#bunny-kalima-status').innerText()).includes('माशाअल्लाह')) throw new Error('Completion state missing');

            if(await page.locator('iframe').count()!==0) throw new Error('YouTube iframe should be removed');
            if((await modal.innerText()).includes('YouTube')) throw new Error('YouTube UI should be removed');

            if(errors.length) throw new Error(errors.join(' | '));
            await page.screenshot({path:'bunny-kalma-test.png',fullPage:true});
            console.log('KALMA_TEST_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node kalma-test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bunny-Kalma-Test
          path: bunny-kalma-test.png
