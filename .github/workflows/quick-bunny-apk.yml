name: Quick Bunny APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/quick-bunny-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p bunny-standalone :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Bunny-Teacher-v6.0-Phase4
          path: bunny-standalone/app/build/outputs/apk/debug/app-debug.apk
