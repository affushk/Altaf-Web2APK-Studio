name: Build and Verify Bunny Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-test-bunny-android.yml'
      - 'bunny-standalone/**'

concurrency:
  group: bunny-android-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p bunny-standalone :app:assembleDebug --stacktrace

      - name: Verify app in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r bunny-standalone/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.altaf.bunnyteacher
            adb shell am start -n com.altaf.bunnyteacher/.MainActivity --ez smoke_test true

            bash -lc 'READY=0; NAV=0; for i in $(seq 1 150); do LOGS="$(adb logcat -d -s BunnyTeacher:I BunnyTeacher:E "*:S")"; echo "$LOGS" | grep -q "BUNNY_READY" && READY=1; echo "$LOGS" | grep -q "ABC_NAV_OK" && NAV=1 && break; echo "$LOGS" | grep -q "ABC_NAV_FAIL" && break; sleep 1; done; adb exec-out screencap -p > bunny-android-screenshot.png; adb shell uiautomator dump /sdcard/window.xml || true; adb pull /sdcard/window.xml bunny-window.xml || true; adb logcat -d | grep -Ei "chromium|bunnyteacher|AndroidRuntime|crash|Console|BUNNY_|ABC_NAV" > bunny-logcat.txt || true; if [ "$READY" -ne 1 ]; then echo "Bunny Teacher did not report ready state"; exit 2; fi; if [ "$NAV" -ne 1 ]; then echo "ABC navigation did not pass"; exit 3; fi'

      - name: Sanity check screenshot exists
        run: |
          test -s bunny-android-screenshot.png
          test -s bunny-standalone/app/build/outputs/apk/debug/app-debug.apk
          ls -lh bunny-android-screenshot.png bunny-standalone/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Bunny-Teacher-Android-Verified
          path: |
            bunny-standalone/app/build/outputs/apk/debug/app-debug.apk
            bunny-android-screenshot.png
            bunny-window.xml
            bunny-logcat.txt
