name: Diagnose Bunny Click Crash

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diagnose-bunny-clicks.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Diagnose clicks
        run: |
          (cd bunny-standalone/app/src/main/assets/www && python3 -m http.server 8000 >/tmp/http.log 2>&1) &
          cat > diagnose.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          async function test(label, selectorText){
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:430,height:900}});
            const logs=[];
            page.on('console', m=>logs.push({type:'console-'+m.type(),text:m.text()}));
            page.on('pageerror', e=>logs.push({type:'pageerror',text:String(e),stack:e.stack||''}));
            await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(1200);
            const btn=page.getByRole('button',{name:new RegExp(selectorText,'i')}).first();
            await btn.click();
            await page.waitForTimeout(1500);
            const state=await page.evaluate(()=>({text:document.body?.innerText||'',html:document.body?.innerHTML.slice(0,3000)||''}));
            await page.screenshot({path:`diag-${label}.png`,fullPage:true});
            fs.writeFileSync(`diag-${label}.json`,JSON.stringify({logs,state},null,2));
            console.log('CASE',label);
            console.log(JSON.stringify({logs,stateText:state.text.slice(0,4000)},null,2));
            await browser.close();
          }

          (async()=>{
            for(const [label,text] of [['abc','ABC'],['numbers','गिनती'],['game','गेम'],['draw','ड्रॉ']]){
              try{await test(label,text)}catch(e){console.error('CASE_FAIL',label,e.stack||e)}
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node diagnose.js
      - uses: actions/upload-artifact@v4
        with:
          name: Bunny-Click-Diagnostics
          path: |
            diag-*.png
            diag-*.json
